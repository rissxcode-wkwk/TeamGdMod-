# Ekstrak proyek yang diunggah ke repo (tanpa Termux), lalu jalankan build.
#
# Cara pakai: unggah SALAH SATU file ini ke root repo lewat situs GitHub (Add file -> Upload files):
#   1. file ZIP proyek (nama bebas, bahkan tanpa akhiran .zip), atau
#   2. TeamGdMod-bundle.txt (versi teks biasa dari ZIP, untuk HP yang gagal mengunduh ZIP)
# Lalu jalankan workflow ini (otomatis saat push, atau manual lewat Run workflow).
# Bila ada beberapa unggahan di root, yang dipakai adalah yang PALING BARU di-commit.
# Setelah selesai, semua file unggahan dihapus dari repo.
#
# Alasan berhasil / gagal ditampilkan di halaman ringkasan run (bagian Annotations dan Summary),
# jadi tidak perlu membuka log untuk mengetahui penyebabnya.
name: Ekstrak ZIP TeamGdMod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  ekstrak:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo (dengan riwayat lengkap)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ekstrak unggahan terbaru dan perbarui file proyek
        id: ekstrak
        run: |
          set -euo pipefail
          RINGKAS="${GITHUB_STEP_SUMMARY:-/dev/null}"
          TMP="${RUNNER_TEMP:-/tmp}/ekstrak"
          rm -rf "$TMP"
          mkdir -p "$TMP/isi"
          NAMA_BUNDLE="TeamGdMod-bundle.txt"

          # Pesan singkat yang tampil di bagian Annotations halaman ringkasan
          gagal() {
            echo "::error title=Ekstrak gagal::$1"
            { echo "### Ekstrak gagal"; echo; echo "$1"; } >> "$RINGKAS"
            exit 1
          }
          info() {
            echo "::notice title=Ekstrak::$1"
            echo "- $1" >> "$RINGKAS"
          }

          info "Isi root repo: $(ls -1A | grep -v '^\.git$' | paste -sd '|' -)"

          # Kumpulkan kandidat di root repo: file yang isinya ZIP (apa pun namanya) atau bundle teks.
          # Pilih yang waktu commit-nya paling baru (BUKAN waktu file, karena saat checkout semuanya sama).
          TERBARU=-1
          PILIH=""
          JENIS=""
          while IFS= read -r f; do
            nama="${f#./}"
            rc=0
            unzip -tq "$f" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -le 1 ]; then
              jenis="zip"      # kode 0 = bersih, 1 = ada peringatan tapi tetap bisa dibaca
            elif [ "$nama" = "$NAMA_BUNDLE" ]; then
              jenis="bundle"
            else
              continue
            fi
            waktu="$(git log -1 --format=%ct -- "$f" 2>/dev/null || true)"
            waktu="${waktu:-0}"
            echo "Kandidat: $nama ($jenis), waktu commit: $waktu"
            if [ "$waktu" -gt "$TERBARU" ]; then
              TERBARU="$waktu"
              PILIH="$f"
              JENIS="$jenis"
            fi
          done < <(find . -maxdepth 1 -type f ! -name '.*' | sort)

          if [ -z "$PILIH" ]; then
            info "Tidak ada ZIP atau bundle di root repo, jadi tidak ada yang dikerjakan. Unggah dulu ZIP-nya lewat Add file -> Upload files."
            echo "ada=false" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi
          info "Memakai: ${PILIH#./} (jenis: $JENIS)"

          if [ "$JENIS" = "bundle" ]; then
            ZIP="$TMP/dari-bundle.zip"
            if ! tr -d '\r\n\t ' < "$PILIH" | base64 -d > "$ZIP" 2>/dev/null; then
              gagal "Isi TeamGdMod-bundle.txt bukan base64 yang valid (file terpotong atau tersimpan rusak). Unduh ulang lalu unggah lagi, atau pakai file ZIP."
            fi
            rc=0
            unzip -tq "$ZIP" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -gt 1 ]; then
              gagal "TeamGdMod-bundle.txt berhasil didekode tetapi hasilnya bukan ZIP yang utuh (kemungkinan terpotong saat diunduh). Unduh ulang lalu unggah lagi."
            fi
          else
            ZIP="$PILIH"
          fi

          rc=0
          unzip -q -o "$ZIP" -d "$TMP/isi" >/dev/null 2>&1 || rc=$?
          if [ "$rc" -gt 1 ]; then
            gagal "Gagal mengekstrak ZIP (kode unzip: $rc). Coba buat ulang ZIP-nya lalu unggah lagi."
          fi

          # Cari folder proyek (yang berisi mod.json), baik di root ZIP maupun di dalam folder
          MODJSON="$(find "$TMP/isi" -maxdepth 4 -name mod.json | head -n 1 || true)"
          if [ -z "$MODJSON" ]; then
            ISI="$(unzip -Z1 "$ZIP" 2>/dev/null | head -n 8 | paste -sd ',' - || true)"
            gagal "mod.json tidak ditemukan di dalam ${PILIH#./}. Isi teratas ZIP: ${ISI:-kosong}. Pastikan yang diunggah adalah ZIP proyek TeamGdMod yang benar."
          fi
          SRC="$(dirname "$MODJSON")"
          VERSI="$(grep -o '"version"[^,]*' "$MODJSON" | head -n 1 | tr -d ' "' || true)"

          # Hapus kode lama beserta semua file unggahan (kecuali .git dan .github), lalu salin yang baru.
          # Folder .github tidak disentuh: workflow tidak boleh mengubah workflow dirinya sendiri.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          (cd "$SRC" && tar --exclude=.git --exclude=.github -cf - .) | tar -xf -

          info "Berhasil mengekstrak proyek (${VERSI:-versi tidak terbaca})."
          echo "ada=true" >> "${GITHUB_OUTPUT:-/dev/null}"

      - name: Simpan perubahan
        if: steps.ekstrak.outputs.ada == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice title=Ekstrak::Tidak ada perubahan untuk disimpan."
            exit 0
          fi
          git commit -m "Perbarui TeamGdMod dari unggahan"
          if ! git push; then
            echo "::error title=Gagal menyimpan::Push ditolak. Buka Settings -> Actions -> General -> Workflow permissions, pilih Read and write permissions, lalu jalankan ulang."
            exit 1
          fi

      # Commit dari workflow tidak memicu build otomatis, jadi build dijalankan manual di sini
      - name: Jalankan build
        if: steps.ekstrak.outputs.ada == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh workflow run main.yml --ref "${{ github.ref_name }}"; then
            echo "::warning title=Build tidak terpicu::Tidak bisa menjalankan main.yml otomatis. Jalankan manual lewat Actions -> Build TeamGdMod -> Run workflow."
            exit 1
          fi
