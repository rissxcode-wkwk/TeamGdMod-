# Ekstrak ZIP proyek yang diunggah ke repo (tanpa Termux), lalu jalankan build.
# Cara pakai: unggah file .zip proyek ke root repo lewat situs GitHub
# (Add file -> Upload files). Workflow ini jalan otomatis.
name: Ekstrak ZIP TeamGdMod

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  ekstrak:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Ekstrak ZIP dan perbarui file proyek
        run: |
          set -euo pipefail

          # ZIP terbaru di root repo (nama file bebas, mis. "TeamGdMod-source (1).zip")
          ZIP="$(ls -t ./*.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "Tidak ada file .zip di root repo."
            exit 1
          fi
          echo "Memakai: $ZIP"

          TMP="${RUNNER_TEMP:-/tmp}/ekstrak"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q -o "$ZIP" -d "$TMP"

          # Cari folder proyek (yang berisi mod.json), baik di root ZIP maupun di dalam satu folder
          MODJSON="$(find "$TMP" -maxdepth 2 -name mod.json | head -n 1 || true)"
          if [ -z "$MODJSON" ]; then
            echo "mod.json tidak ditemukan di dalam ZIP: ini bukan proyek mod Geode."
            exit 1
          fi
          SRC="$(dirname "$MODJSON")"

          # Hapus kode lama (kecuali .git, .github, dan file ZIP), lalu salin yang baru.
          # Folder .github tidak disentuh: workflow tidak boleh mengubah workflow dirinya sendiri.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name '*.zip' -exec rm -rf {} +
          (cd "$SRC" && tar --exclude=.git --exclude=.github -cf - .) | tar -xf -

      - name: Simpan perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "Perbarui TeamGdMod dari ZIP"
          git push

      # Commit dari workflow tidak memicu build otomatis, jadi build dijalankan manual di sini
      - name: Jalankan build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --ref "${{ github.ref_name }}"
        
