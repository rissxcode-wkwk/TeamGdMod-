name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build untuk Android 64-bit memakai Geode SDK stabil terbaru
      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      # Unggah file .geode hasil build sebagai artifact
      - name: Upload Geode File
        uses: actions/upload-artifact@v4
        with:
          name: TeamGdMod
          path: ${{ steps.build.outputs.build-output }}
