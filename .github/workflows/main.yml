# Mengosongkan isi sebuah folder di repo (atau seluruh repo) lewat tombol "Run workflow".
# Pengaman: hanya jalan manual, harus mengetik HAPUS, dan folder .git / .github tidak pernah disentuh.
# Riwayat commit tetap tersimpan, jadi hasilnya masih bisa dikembalikan (lihat tab Commits -> Revert).
name: Hapus Isi Folder

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Folder yang dikosongkan, contoh: src. Isi titik (.) untuk SELURUH repo.'
        required: true
        default: 'src'
      konfirmasi:
        description: 'Ketik HAPUS (huruf besar) untuk melanjutkan'
        required: true

permissions:
  contents: write

jobs:
  hapus:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Periksa masukan dan hapus isi
        env:
          # Masukan dilewatkan lewat variabel lingkungan (bukan disisipkan ke perintah) agar aman
          FOLDER: ${{ inputs.folder }}
          KONFIRMASI: ${{ inputs.konfirmasi }}
        run: |
          set -euo pipefail

          if [ "$KONFIRMASI" != "HAPUS" ]; then
            echo "Konfirmasi salah: ketik persis HAPUS. Tidak ada yang dihapus."
            exit 1
          fi

          # Bersihkan masukan: buang garis miring di awal/akhir dan spasi di tepi
          F="$(printf '%s' "$FOLDER" | sed -e 's#^[[:space:]]*##' -e 's#[[:space:]]*$##' -e 's#^\./##' -e 's#/*$##')"
          [ -z "$F" ] && F="."

          # Tolak jalur berbahaya
          case "$F" in
            /*|*..*|.git|.git/*|.github|.github/*)
              echo "Folder tidak diizinkan: $F (tidak boleh memakai .., jalur absolut, .git, atau .github)."
              exit 1
              ;;
          esac

          if [ "$F" = "." ]; then
            echo "Mengosongkan SELURUH repo (kecuali .git dan .github)."
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          else
            if [ ! -d "$F" ]; then
              echo "Folder tidak ditemukan: $F"
              exit 1
            fi
            echo "Mengosongkan folder: $F"
            find "$F" -mindepth 1 -delete
          fi

      - name: Simpan perubahan
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada yang berubah (folder sudah kosong)."
            exit 0
          fi
          git commit -m "Kosongkan: $FOLDER"
          git push
