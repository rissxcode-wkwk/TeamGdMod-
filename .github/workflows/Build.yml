# Build otomatis TeamGdMod untuk Android 64-bit memakai versi Geode SDK yang tertulis di mod.json.
# Cara pakai: push ke GitHub -> tab Actions -> buka run terbaru -> unduh artifact "TeamGdMod-android".
name: Build TeamGdMod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      -       - name: Build mod pakai Geode SDK
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 'given'
          target: Android64
          ccache: false
          target: Android64

      - name: Upload hasil .geode sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamGdMod-android
          path: build/*.geode
          
