name: Build TeamGdMod
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows, os: windows-latest, ccache: default }
          - { name: Android64, os: ubuntu-latest, target: Android64, ccache: ccache }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: given
          target: ${{ matrix.config.target }}
          ccache-variant: ${{ matrix.config.ccache }}
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: TeamGdMod
          path: ${{ steps.build.outputs.build-output }}