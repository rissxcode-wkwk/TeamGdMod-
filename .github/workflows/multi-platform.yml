name: Build Eclipse (Windows, macOS, iOS, Android 32/64)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          build-type: RelWithDebInfo

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32
          min-sdk: 24

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Kunci versi bindings Geode
        shell: bash
        run: |
          git clone https://github.com/geode-sdk/bindings.git "$RUNNER_TEMP/bindings"
          git -C "$RUNNER_TEMP/bindings" checkout 5db3b324c53cd8124efa7453131252bb78362c28
          echo "GEODE_BINDINGS_REPO_PATH=$RUNNER_TEMP/bindings" >> "$GITHUB_ENV"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          export-pdb: true
          target: ${{ matrix.config.target }}
          android-min-sdk: ${{ matrix.config.min-sdk || 23 }}
          build-config: ${{ matrix.config.build-type || 'Release' }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Geode Build
          path: ${{ steps.build.outputs.build-output }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/bin
          merge-multiple: true

      - name: Cek file hasil build
        run: ls -la "${{ github.workspace }}/bin"

      - name: Create rolling release
        if: github.event_name != 'pull_request'
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: rolling-release
          prerelease: true
          name: 'Rolling Release'
          body: |
            Build terbaru mod untuk commit ${{ github.sha }} (${{ github.event.head_commit.message }}).

            Target: Geometry Dash 2.2091 + Geode 6.0.0-alpha.1.
            Platform: Windows, macOS, iOS, Android 32-bit, Android 64-bit.
          files: |
            ${{ github.workspace }}/bin/*.geode
            ${{ github.workspace }}/bin/*.pdb
