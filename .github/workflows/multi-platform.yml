name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build-linux-input:
    name: Build linux-input.so
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y g++ libevdev-dev

      - name: Build
        working-directory: src/linux
        run: |
          mkdir -p ../../resources
          g++ -O2 -o ../../resources/linux-input.so linux-input.cpp -levdev

      - uses: actions/upload-artifact@v4
        with:
          name: linux-input.so
          path: resources/linux-input.so

  build:
    needs: ['build-linux-input']
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32
          min-sdk: 24

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Download linux-input.so
        uses: actions/download-artifact@v4
        with:
          name: linux-input.so
          path: resources

      - name: Kunci versi bindings Geode
        shell: bash
        run: |
          git clone https://github.com/geode-sdk/bindings.git "$RUNNER_TEMP/bindings"
          git -C "$RUNNER_TEMP/bindings" checkout 5db3b324c53cd8124efa7453131252bb78362c28
          echo "GEODE_BINDINGS_REPO_PATH=$RUNNER_TEMP/bindings" >> "$GITHUB_ENV"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}
          android-min-sdk: ${{ matrix.config.min-sdk || 23 }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Geode Build
          path: ${{ steps.build.outputs.build-output }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/bin
          merge-multiple: true

      - name: Cek file hasil build
        run: ls -la "${{ github.workspace }}/bin"

      - name: Create rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cbf-rolling
          name: 'Click Between Frames Rolling Release'
          prerelease: true
          body: |
            Build terbaru Click Between Frames untuk commit ${{ github.sha }}.
            Platform: Windows, macOS, iOS, Android 32-bit, Android 64-bit.
            Target: Geometry Dash 2.2091 + Geode 6.0.0-alpha.1.
          files: |
            ${{ github.workspace }}/bin/*.geode
          fail_on_unmatched_files: true