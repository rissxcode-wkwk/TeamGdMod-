name: Build FFmpeg API (Android 64)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Library FFmpeg dibangun dari source (butuh beberapa menit), lalu di-cache supaya build berikutnya cepat.
      - name: Cache library FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: lib/arm64-v8a
          key: ffmpeg-libs-android64-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}

      - name: Build library FFmpeg (Android arm64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh

      - name: Cek library FFmpeg
        run: |
          ls -la lib/arm64-v8a
          test -f lib/arm64-v8a/libavcodec.a
          test -f lib/arm64-v8a/libavformat.a
          test -f lib/arm64-v8a/libavutil.a
          test -f lib/arm64-v8a/libswresample.a
          test -f lib/arm64-v8a/libswscale.a
          test -f lib/arm64-v8a/libavfilter.a

      # Bindings dikunci ke commit yang sama dengan build EclipseMenu supaya konsisten.
      - name: Kunci versi bindings Geode
        run: |
          git clone https://github.com/geode-sdk/bindings.git "$RUNNER_TEMP/bindings"
          git -C "$RUNNER_TEMP/bindings" checkout 5db3b324c53cd8124efa7453131252bb78362c28
          echo "GEODE_BINDINGS_REPO_PATH=$RUNNER_TEMP/bindings" >> "$GITHUB_ENV"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # 'given' = versi Geode dibaca dari mod.json ("geode": "6.0.0-alpha.1"), terbukti jalan di log CI.
          sdk: given
          combine: true
          target: Android64

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Geode Build
          path: ${{ steps.build.outputs.build-output }}
