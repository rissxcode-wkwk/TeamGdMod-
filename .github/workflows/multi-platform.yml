name: Build FFmpeg API (Windows, macOS, Android 32/64)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false   # satu platform gagal tidak membatalkan platform lain
      matrix:
        config:
        - name: Windows
          os: windows-latest
          libs: lib
          script: build-ffmpeg-windows.sh

        - name: macOS
          os: macos-latest
          libs: lib
          script: build-ffmpeg-macos.sh

        - name: Android32
          os: ubuntu-latest
          target: Android32
          min-sdk: 24
          libs: lib/armeabi-v7a
          script: build-ffmpeg-android.sh
          abi: armeabi-v7a

        - name: Android64
          os: ubuntu-latest
          target: Android64
          libs: lib/arm64-v8a
          script: build-ffmpeg-android.sh
          abi: arm64-v8a

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # Library FFmpeg dibangun dari source (butuh beberapa menit), lalu di-cache supaya build berikutnya cepat.
      - name: Cache library FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.config.libs }}
          key: ffmpeg-libs-${{ matrix.config.name }}-${{ hashFiles('scripts/build-ffmpeg-*.sh') }}

      # --- macOS: nasm dibutuhkan untuk x264 x86_64 ---
      - name: Pasang tool (macOS)
        if: matrix.config.name == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install nasm pkg-config

      # --- Windows: MSVC + MSYS2 ---
      - name: Aktifkan MSVC (Windows)
        if: matrix.config.name == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pasang MSYS2 (Windows)
        if: matrix.config.name == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils yasm nasm pkgconf git

      - name: Build library FFmpeg (Windows)
        if: matrix.config.name == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/${{ matrix.config.script }}

      - name: Build library FFmpeg (macOS / Android)
        if: matrix.config.name != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ABI: ${{ matrix.config.abi }}
        run: bash scripts/${{ matrix.config.script }}

      - name: Cek library FFmpeg
        shell: bash
        run: |
          ls -la "${{ matrix.config.libs }}"
          if [ "${{ matrix.config.name }}" = "Windows" ]; then
            test -f lib/avcodec.lib
          else
            test -f "${{ matrix.config.libs }}/libavcodec.a"
          fi

      # Bindings dikunci ke commit yang sama dengan build EclipseMenu supaya konsisten.
      - name: Kunci versi bindings Geode
        shell: bash
        run: |
          git clone https://github.com/geode-sdk/bindings.git "$RUNNER_TEMP/bindings"
          git -C "$RUNNER_TEMP/bindings" checkout 5db3b324c53cd8124efa7453131252bb78362c28
          echo "GEODE_BINDINGS_REPO_PATH=$RUNNER_TEMP/bindings" >> "$GITHUB_ENV"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given   # versi Geode dibaca dari mod.json
          combine: true
          target: ${{ matrix.config.target }}
          android-min-sdk: ${{ matrix.config.min-sdk || 23 }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Geode Build
          path: ${{ steps.build.outputs.build-output }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/bin
          merge-multiple: true

      - name: Cek file hasil build
        run: ls -la "${{ github.workspace }}/bin"

      # Tag BEDA dari release EclipseMenu (rolling-release), karena andelf/nightly-release
      # menghapus & membuat ulang release bertag sama.
      - name: Create rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-api-rolling
          name: 'ffmpeg-api Rolling Release'
          prerelease: true
          body: |
            Build terbaru ffmpeg-api untuk commit ${{ github.sha }}.
            Platform: Windows, macOS, Android 32-bit, Android 64-bit.
            Target: Geometry Dash 2.2091 + Geode 6.0.0-alpha.1.
          files: |
            ${{ github.workspace }}/bin/*.geode
          fail_on_unmatched_files: true
